<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:type" content="video.other">
<meta property="og:title" content="현장 스케치 하이라이트 · 2026 청구중·고 총동창회 체육대회">
<meta property="og:description" content="10월 24일 수성대학교, 그날의 현장을 7분 영상으로 만나 보세요.">
<meta property="og:image" content="https://YOURID.github.io/cheonggu2026/hl-poster.jpg">
<meta property="og:url" content="https://YOURID.github.io/cheonggu2026/highlight.html">
<title>현장 스케치 하이라이트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: one dark screening room — title, the 3:4 film centred, chapter list below. Single deliberate dark look. */
:root {
  --bg: #0c162c; --bg-2: #142444; --fg: #eef2fa; --muted: #93a3bf; --accent: #6aa8ff; --line: rgba(255,255,255,.12);
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); font-family: var(--sans); }
body { background: radial-gradient(ellipse at 50% 0%, var(--bg-2), var(--bg) 70%) var(--bg); min-height: 100%; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 40px; display: flex; flex-direction: column; gap: 16px; }
.eyebrow { font-size: 13px; letter-spacing: .14em; color: var(--accent); font-weight: 700; margin: 0; }
h1 { margin: 2px 0 0; font-size: clamp(28px, 7vw, 40px); font-weight: 900; letter-spacing: -.02em; text-wrap: balance; }
.meta { margin: 0; color: var(--muted); font-size: 15px; }
.film { position: relative; width: 100%; aspect-ratio: 3 / 4; max-width: 100%; background: #000; border-radius: 14px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.45); }
.film video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
.big { position: absolute; inset: 0; display: grid; place-items: center; background: transparent; border: 0; cursor: pointer; }
.big span { width: 84px; height: 84px; border-radius: 50%; background: rgba(255,255,255,.9); display: grid; place-items: center; }
.big span::before { content: ""; border-left: 26px solid #12305c; border-top: 16px solid transparent; border-bottom: 16px solid transparent; margin-left: 6px; }
.bar { display: flex; align-items: center; gap: 10px; }
.bar button { font: inherit; font-size: 15px; color: var(--fg); background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 10px; height: 42px; padding: 0 14px; cursor: pointer; }
.bar button:hover { background: rgba(255,255,255,.13); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.prog { flex: 1; min-width: 0; height: 6px; background: rgba(255,255,255,.12); border-radius: 3px; overflow: hidden; cursor: pointer; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); }
.time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; white-space: nowrap; }
h2 { margin: 10px 0 0; font-size: 17px; font-weight: 700; }
ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
ol button { width: 100%; text-align: left; display: flex; gap: 12px; align-items: baseline; font: inherit; color: var(--fg); background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 11px 4px; cursor: pointer; }
ol button:hover { background: rgba(255,255,255,.05); }
ol b { color: var(--accent); font-variant-numeric: tabular-nums; min-width: 2ch; }
ol span { flex: 1; min-width: 0; font-size: 16px; }
ol em { font-style: normal; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
ol button.now span { color: var(--accent); font-weight: 700; }
.foot { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
</style>
</head>
<body>


<div class="wrap">
  <div>
    <p class="eyebrow">SCENE SKETCH · HIGHLIGHT</p>
    <h1>현장 스케치 하이라이트</h1>
    <p class="meta">2026 청구중·고등학교 총동창회 체육대회 · 10월 24일(토) 수성대학교 · 7분 11초</p>
  </div>
  <div class="film">
    <video id="v" playsinline preload="metadata" poster="hl-poster.jpg"></video>
    <button class="big" id="big" aria-label="재생"><span></span></button>
  </div>
  <div class="bar">
    <button id="pp" aria-label="재생/일시정지">▶ 재생</button>
    <div class="prog" id="prog" aria-label="재생 위치"><i id="fill"></i></div>
    <span class="time" id="time">0:00 / 7:11</span>
    <button id="fs" aria-label="전체 화면">⛶</button>
  </div>
  <h2>장면 바로 보기</h2>
  <ol id="ch"></ol>
  <p class="foot">배경음악은 직접 만든 곡이며, 현장 영상 구간에서는 현장 소리가 나옵니다.</p>
</div>

<script>
(function () {
  const PARTS = ['v2/hl1.mp4', 'v2/hl2.mp4', 'v2/hl3.mp4', 'v2/hl4.mp4'];
  const PL = 107.8, TOTAL = 431.0;   // 조각 길이(초), 전체 길이
  const CH = [['대회 알림', 3.0], ['행사장 준비', 15.6], ['천막 순회 인사', 28.2], ['제기차기와 족구', 51.2], ['개회식', 78.5],
    ['기수별 천막', 287.0], ['승부차기', 304.8], ['점심과 윷놀이·훌라후프', 325.2], ['축하 공연', 353.2], ['시상과 경품 추첨', 378.6], ['기수별 단체 사진', 406.6]];
  const v = document.getElementById('v'), pp = document.getElementById('pp'), big = document.getElementById('big');
  const fill = document.getElementById('fill'), time = document.getElementById('time'), ol = document.getElementById('ch');
  let part = 0, pending = null;
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  function load(k, at, play) {
    part = k; pending = at || 0; v.src = PARTS[k];
    v.addEventListener('loadedmetadata', function f() { v.removeEventListener('loadedmetadata', f); try { v.currentTime = pending; } catch (e) {} if (play) v.play().catch(() => {}); });
  }
  function seek(t, play) {
    t = Math.max(0, Math.min(TOTAL - 0.5, t)); const k = Math.min(PARTS.length - 1, Math.floor(t / PL));
    if (k === part && v.src) { v.currentTime = t - k * PL; if (play) v.play().catch(() => {}); } else load(k, t - k * PL, play);
  }
  CH.forEach(([n, t], i) => {
    const li = document.createElement('li'), b = document.createElement('button');
    b.innerHTML = '<b>' + String(i + 1).padStart(2, '0') + '</b><span></span><em>' + fmt(t) + '</em>';
    b.querySelector('span').textContent = n; b.onclick = () => seek(t, true);
    li.appendChild(b); ol.appendChild(li);
  });
  load(0, 0, false);
  const toggle = () => { if (v.paused) v.play().catch(() => {}); else v.pause(); };
  pp.onclick = toggle; big.onclick = toggle; v.onclick = toggle;
  v.addEventListener('play', () => { big.hidden = true; pp.textContent = '❚❚ 멈춤'; });
  v.addEventListener('pause', () => { pp.textContent = '▶ 재생'; });
  v.addEventListener('ended', () => { if (part < PARTS.length - 1) load(part + 1, 0, true); else { big.hidden = false; load(0, 0, false); } });
  v.addEventListener('timeupdate', () => {
    const t = part * PL + v.currentTime; fill.style.width = (t / TOTAL * 100) + '%'; time.textContent = fmt(t) + ' / ' + fmt(TOTAL);
    let c = 0; CH.forEach(([, s], i) => { if (t >= s) c = i; });
    ol.querySelectorAll('button').forEach((b, i) => b.classList.toggle('now', i === c));
  });
  document.getElementById('prog').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * TOTAL, true); };
  document.getElementById('fs').onclick = () => { const el = document.querySelector('.film'); try { (el.requestFullscreen ? el.requestFullscreen() : v.webkitEnterFullscreen && v.webkitEnterFullscreen()); } catch (e) {} };
})();
</script>

</body>
</html>
