  pf.on('changeState', e => { if (e.data === 'flipping' || e.data === 'user_fold') loadAround(pf.getCurrentPageIndex()); });

  btn('prevBtn').onclick = () => pf.flipPrev();
  btn('nextBtn').onclick = () => pf.flipNext();
  btn('firstBtn').onclick = () => { loadAround(0); pf.turnToPage(0); sync(); };
  btn('lastBtn').onclick = () => { loadAround(TOTAL - 1); pf.turnToPage(TOTAL - 1); sync(); };
  input.addEventListener('change', () => {
    let n = Math.min(TOTAL, Math.max(1, parseInt(input.value, 10) || 1)) - 1;
    loadAround(n); pf.turnToPage(n); sync();
  });
  document.addEventListener('keydown', e => {
    if (e.target === input) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); pf.flipNext(); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); pf.flipPrev(); }
    if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
  });
  // 자동 넘김: 끝에 닿으면 표지로 돌아가 계속 반복
  let timer = null;
  const speedSel = btn('speedSel');
  function tick(force) {
    if (pf.getState() !== 'read') return;   // 손으로 넘기는 중이면 건드리지 않음
    // 짧은 현장 영상은 끝날 때까지 기다리고, 긴 하이라이트 영상은 기다리지 않음
    // 하이라이트 영상 쪽에서는 자동넘김을 멈추고 손으로 넘길 때까지 기다림
    if (visibleIdx().includes(HLIDX)) return;
    // 짧은 현장 영상은 끝날 때까지 기다림
    if (!force && cur && !cur.v.paused && !cur.v.ended) return;
    if (pf.getCurrentPageIndex() >= TOTAL - 1) { loadAround(0); pf.turnToPage(0); sync(); }
    else pf.flipNext();
  }
  // 배경음악: 잔잔한 발라드(자체 작곡), Web Audio로 합성
  const March = (() => {
    let ctx = null, master = null, wet = null, loopTimer = null, playing = false;
    const BPM = 72, B = 60 / BPM, R = null;
    // 마디별 화음 { 베이스, 화음 구성음 }
    const CH = {
      C: [36, [60, 64, 67]], GB: [35, [59, 62, 67]], Am: [33, [57, 60, 64]], F: [41, [57, 60, 65]],
      G: [43, [59, 62, 67]], Em: [40, [59, 64, 67]], Dm: [38, [57, 62, 65]]
    };
    const prog = ['C','GB','Am','F','C','G','F','G', 'Am','Em','F','C','Dm','G','C','C'];
    // 선율 [MIDI, 박] — 마디당 4박
    const mel = [
      [76,2],[74,1],[72,1], [74,3],[67,1], [72,1.5],[71,.5],[72,1],[76,1], [77,2],[76,1],[72,1],
      [76,2],[79,2], [79,1.5],[77,.5],[74,2], [72,1],[74,1],[77,1],[81,1], [79,4],
      [81,2],[79,1],[76,1], [79,2],[76,2], [77,1.5],[76,.5],[72,1],[69,1], [72,1],[76,1],[79,2],
      [77,2],[81,1],[77,1], [74,2],[71,1],[74,1], [72,4], [R,4]
    ];
    const hz = m => 440 * Math.pow(2, (m - 69) / 12);
    function env(g, t, a, peak, dur) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(peak, t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    }
    function out(node, dry, rev) {
      const d = ctx.createGain(), w = ctx.createGain(); d.gain.value = dry; w.gain.value = rev;
      node.connect(d).connect(master); node.connect(w).connect(wet);
    }
    function lead(t, m, dur) {
      const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), lfo = ctx.createOscillator(), lg = ctx.createGain(), g = ctx.createGain();
      o1.type = 'sine'; o2.type = 'triangle'; o1.frequency.value = hz(m); o2.frequency.value = hz(m) * 2.001;
      lfo.frequency.value = 5; lg.gain.value = hz(m) * 0.004; lfo.connect(lg); lg.connect(o1.frequency);
      const g2 = ctx.createGain(); g2.gain.value = .18;
      o1.connect(g); o2.connect(g2).connect(g);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(.2, t + .09);
      g.gain.setValueAtTime(.17, t + Math.max(.1, dur * .7)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + .35);
      out(g, .8, .55);
      [o1, o2, lfo].forEach(o => { o.start(t); o.stop(t + dur + .4); });
    }
    function pluck(t, m, vol) {
      const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle'; o2.type = 'sine'; o.frequency.value = hz(m); o2.frequency.value = hz(m) * 2;
      const g2 = ctx.createGain(); g2.gain.value = .25;
      o.connect(g); o2.connect(g2).connect(g); env(g, t, .005, vol, 1.6);
      out(g, .7, .5); o.start(t); o2.start(t); o.stop(t + 1.7); o2.stop(t + 1.7);
    }
    function bass(t, m, dur) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = hz(m); o.connect(g); env(g, t, .02, .28, dur);
      out(g, .9, .2); o.start(t); o.stop(t + dur + .05);
    }
    function pad(t, notes, dur) {
      const f = ctx.createBiquadFilter(), g = ctx.createGain();
      f.type = 'lowpass'; f.frequency.value = 900;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(.035, t + dur * .4); g.gain.linearRampToValueAtTime(0.0001, t + dur + .3);
      f.connect(g); out(g, .6, .7);
      notes.forEach(n => [-6, 6].forEach(dt => {
        const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(n); o.detune.value = dt;
        o.connect(f); o.start(t); o.stop(t + dur + .4);
      }));
    }
    function scheduleLoop(t0) {
      prog.forEach((name, bar) => {
        const [b, tn] = CH[name], tb = t0 + bar * 4 * B;
        bass(tb, b, 4 * B);
        pad(tb, tn, 4 * B);
        const seq = [tn[0], tn[1], tn[2], tn[0] + 12, tn[2], tn[1], tn[2], tn[1]];
        seq.forEach((n, k) => pluck(tb + k * B / 2, n, k === 0 ? .14 : .1));
      });
      let t = t0;
      // 선율 없이 피아노 반주만
      return t0 + prog.length * 4 * B;
    }
    function loop(t0) {
      const end = scheduleLoop(t0);
      loopTimer = setTimeout(() => loop(end), (end - ctx.currentTime - 1) * 1000);
    }
    function makeReverb() {
      const len = ctx.sampleRate * 2.8, buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5); }
      const cv = ctx.createConvolver(); cv.buffer = buf; return cv;
    }
    return {
      get playing() { return playing; },
      start() {
        try {
          if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
          ctx.resume();
          master = ctx.createGain(); master.gain.setValueAtTime(0.0001, ctx.currentTime); master.gain.linearRampToValueAtTime(.6, ctx.currentTime + 1.5);
          const comp = ctx.createDynamicsCompressor(); master.connect(comp).connect(ctx.destination);
          wet = makeReverb(); wet.connect(master);
          playing = true; loop(ctx.currentTime + .1);
        } catch (e) { playing = false; }
      },
      stop() {
        playing = false; clearTimeout(loopTimer);
        if (master) { const m = master; m.gain.setTargetAtTime(0.0001, ctx.currentTime, .3); setTimeout(() => m.disconnect(), 1500); master = null; }
      }
    };
  })();
  let musicOff = false;
  function syncMusicBtn() { btn('musicBtn').classList.toggle('on', March.playing); }
  btn('musicBtn').onclick = () => {
    if (March.playing) { March.stop(); musicOff = true; } else { March.start(); musicOff = false; }
    syncMusicBtn();
  };

  function startAuto(quiet) { stopAuto(); if (!quiet && !musicOff && !March.playing) { March.start(); syncMusicBtn(); } timer = setInterval(tick, +speedSel.value); btn('autoBtn').classList.add('on'); btn('autoBtn').firstChild.textContent = '❚❚ '; }
  function stopAuto() { if (timer) clearInterval(timer); timer = null; btn('autoBtn').classList.remove('on'); btn('autoBtn').firstChild.textContent = '▶▶ '; }
  function toggleAuto() { timer ? stopAuto() : startAuto(); }
  btn('autoBtn').onclick = toggleAuto;
  // 손가락·마우스로 넘기면 자동넘김 시계를 다시 맞춤 (손으로 넘긴 뒤 3초 쉬고 이어감)
  function nudgeAuto() { if (timer) { clearInterval(timer); timer = setInterval(tick, +speedSel.value); } }
  ['pointerdown', 'touchstart', 'pointerup', 'touchend'].forEach(ev => document.querySelector('.stage').addEventListener(ev, nudgeAuto, { passive: true }));
  pf.on('changeState', e => { if (e.data === 'user_fold' || e.data === 'flipping') nudgeAuto(); });
  speedSel.onchange = () => { if (timer) startAuto(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) { stopAuto(); if (March.playing) { March.stop(); syncMusicBtn(); } } });

  // 현장 스케치로 바로 가기
  btn('photoBtn').onclick = () => { loadAround(2); pf.turnToPage(2); sync(); };

  // 쪽 안 영상: 쪽을 펼치면 자동 재생, 넘기면 멈춤
  let cur = null, musicWas = false, gestured = false;
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { gestured = true; }, true));
  // 휴대폰(특히 아이폰)은 화면을 누르는 순간에만 소리 있는 재생을 허락하므로,
  // 첫 터치 때 모든 영상을 미리 '소리 켜짐'으로 풀어 둠 → 이후 영상 쪽이 열리면 소리와 함께 자동 재생
  let unlocked = false;
  function unlockVideos() {
    if (unlocked) return; unlocked = true; gestured = true;
    Object.values(PV).forEach(t => {
      if (t === cur) { t.v.muted = false; return; }
      if (t.v.dataset.src) { t.v.src = t.v.dataset.src; delete t.v.dataset.src; }
      t.v.muted = false;
      const pr = t.v.play(); t.v.pause(); if (pr && pr.catch) pr.catch(() => {});
    });
    if (cur && cur.v.muted) { cur.v.muted = false; cur.v.play().catch(() => {}); }
  }
  ['touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, unlockVideos, { capture: true }));
  function visibleIdx() {
    const i = pf.getCurrentPageIndex();
    if (pf.getOrientation() !== 'landscape' || i === 0) return [i];
    const L = i % 2 ? i : i - 1; return [L, L + 1];
  }
  function showSnd(t) { t.snd.hidden = !t.v.muted; }
  function startVid(t) {
    if (cur && cur !== t) stopVid();
    cur = t;
    if (t.v.dataset.src) { t.v.src = t.v.dataset.src; delete t.v.dataset.src; }
    if (March.playing) { musicWas = true; March.stop(); syncMusicBtn(); }
    t.v.muted = !gestured;
    try { t.v.currentTime = 0; } catch (e) {}
    t.v.classList.add('on');
    const p = t.v.play();
    if (p && p.catch) p.catch(() => { t.v.muted = true; showSnd(t); t.v.play().catch(() => {}); });
    showSnd(t);
  }
  function stopVid() {
    if (!cur) return;
    cur.v.pause(); cur.v.classList.remove('on'); cur.snd.hidden = true;
    if (cur.v.dataset.parts && cur.pi) { cur.pi = 0; cur.v.src = JSON.parse(cur.v.dataset.parts)[0]; }
    try { cur.v.currentTime = 0; } catch (e) {}
    cur = null;
    if (musicWas && !musicOff) { March.start(); syncMusicBtn(); }
    musicWas = false;
  }
  function updateVideos() {
    const vis = visibleIdx().filter(i => PV[i]);
    if (cur && !vis.some(i => PV[i] === cur)) stopVid();
    if (!cur && vis.length) startVid(PV[vis[0]]);
  }
  Object.keys(PV).forEach(k => {
    const t = PV[k];
    t.v.addEventListener('ended', () => {
      // 여러 조각으로 나뉜 영상은 다음 조각을 이어서 재생
      if (t.v.dataset.parts) {
        const parts = JSON.parse(t.v.dataset.parts); t.pi = (t.pi || 0) + 1;
        if (t.pi < parts.length) { t.v.src = parts[t.pi]; t.v.play().catch(() => {}); return; }
        t.pi = 0; t.v.src = parts[0];
      }
      t.v.classList.remove('on');
      const vis = visibleIdx().filter(i => PV[i]);
      const nxt = vis.map(i => PV[i]).find(o => o !== t && o.v.currentTime === 0 && !o.played);
      t.played = true;
      if (nxt) { cur = null; startVid(nxt); return; }
      stopVid();
      if (timer && !t.v.dataset.parts) setTimeout(() => { if (timer) tick(true); }, 800);
    });
  });
  pf.on('flip', () => { Object.values(PV).forEach(o => { o.played = false; }); setTimeout(updateVideos, 50); });
  pf.on('changeOrientation', () => setTimeout(updateVideos, 50));
  book.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('.vbtn');
    if (!b) return;
    e.stopPropagation();
    if (b.dataset.pv !== undefined) {
      const t = PV[b.dataset.pv];
      if (cur !== t) { gestured = true; startVid(t); return; }
      if (t.v.muted) { t.v.muted = false; showSnd(t); if (t.v.paused) t.v.play().catch(() => {}); return; }
      if (t.v.paused) t.v.play().catch(() => {}); else t.v.pause();
    } else { const n = +b.dataset.goto; loadAround(n); pf.turnToPage(n); sync(); }
  }, true);

  btn('fsBtn').onclick = () => {
    const el = document.documentElement;
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    } catch (e) {}
  };

  let saved = 0;
  try { saved = parseInt(localStorage.getItem('cheonggu-page'), 10) || 0; } catch (e) {}
  if (saved > 0 && saved < TOTAL) { loadAround(saved); pf.turnToPage(saved); }
  // 손가락·마우스 넘김: 밀면 넘기고, 빨리 밀수록 빨리 넘어감. 책 좌우를 톡 누르면 앞뒤로 넘김
  (function () {
    const stage = document.querySelector('.stage');
    let sx = 0, sy = 0, st = 0, on = false, onCtl = false;
    const start = (x, y, target) => { on = true; sx = x; sy = y; st = Date.now(); onCtl = !!(target.closest && target.closest('.vbtn, button, input, select')); };
    const end = (x, y) => {
      if (!on) return; on = false;
      const dx = x - sx, dy = y - sy, dt = Math.max(1, Date.now() - st);
      const set = pf.getSettings();
      if (Math.abs(dx) >= 30 && Math.abs(dx) > Math.abs(dy)) {
        const v = Math.abs(dx) / dt;                       // 밀기 속도(px/ms)
        set.flippingTime = Math.round(Math.max(220, Math.min(800, 420 / Math.max(v, 0.5))));
        if (pf.getState() !== 'read') return;
        dx < 0 ? pf.flipNext() : pf.flipPrev();
      } else if (!onCtl && Math.abs(dx) < 10 && Math.abs(dy) < 10 && dt < 400) {
        const r = stage.getBoundingClientRect(), rel = (x - r.left) / r.width;
        set.flippingTime = 500;
        if (pf.getState() !== 'read') return;
        if (rel > 0.6) pf.flipNext(); else if (rel < 0.4) pf.flipPrev();
      }
    };
    stage.addEventListener('touchstart', e => { if (e.touches.length === 1) start(e.touches[0].clientX, e.touches[0].clientY, e.target); else on = false; }, { passive: true });
    stage.addEventListener('touchend', e => { const t = e.changedTouches[0]; end(t.clientX, t.clientY); }, { passive: true });
    stage.addEventListener('mousedown', e => start(e.clientX, e.clientY, e.target));
    stage.addEventListener('mouseup', e => end(e.clientX, e.clientY));
  })();

  sync();
  // 열고 3초 뒤 자동넘김 시작 (소리는 화면을 한 번 누른 뒤부터)
  setTimeout(() => { if (!timer) startAuto(true); }, 3000);
  document.addEventListener('pointerdown', () => { if (timer && !musicOff && !March.playing) { March.start(); syncMusicBtn(); } }, { once: true, capture: true });
})();
</script>

</body>
</html>
